<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>From Ions to the Derivative — interactive guide</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f3ede1; }
  #root { width: 100vw; height: 100vh; }
  .katex { font-size: 1em !important; }

  /* ion flow (used by MembraneDiagram) */
  @keyframes ionDown { 0%{transform:translateY(0);opacity:0} 14%{opacity:1} 86%{opacity:1} 100%{transform:translateY(120px);opacity:0} }
  @keyframes ionUp   { 0%{transform:translateY(0);opacity:0} 14%{opacity:1} 86%{opacity:1} 100%{transform:translateY(-120px);opacity:0} }
  .ion-down { animation-name: ionDown; animation-timing-function: linear; animation-iteration-count: infinite; }
  .ion-up   { animation-name: ionUp;   animation-timing-function: linear; animation-iteration-count: infinite; }
  @media (prefers-reduced-motion: reduce) { .ion-down, .ion-up { animation: none; } }

  /* themeable range slider (used by Slider) */
  .rng { -webkit-appearance: none; appearance: none; height: 5px; border-radius: 4px;
         background: color-mix(in srgb, var(--acc) 26%, transparent); outline: none; cursor: pointer; }
  .rng::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 17px; height: 17px;
         border-radius: 50%; background: var(--acc); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: pointer; }
  .rng::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--acc);
         border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: pointer; }

  ::selection { background: color-mix(in srgb, #6d28d9 24%, transparent); }
  *::-webkit-scrollbar { width: 11px; height: 11px; }
  *::-webkit-scrollbar-thumb { background: rgba(120,108,86,.32); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="neuro/components.jsx"></script>
<script type="text/babel" src="neuro/guide-core.jsx"></script>
<script type="text/babel" src="neuro/guide-sims.jsx"></script>
<script type="text/babel" src="neuro/guide-content.jsx"></script>
<script type="text/babel" src="neuro/guide-app.jsx"></script>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.GuideApp));
</script>
</body>
</html>
